# Единственная точка конфигурации ДЗ 5
model:
  name: "Qwen/Qwen3-0.6B"
  device: "auto"
  # float32 критичен для работы на CPU без зависаний
  dtype: "float32"
  enable_thinking: false

data:
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  seed: 42
  epochs: 1
  batch_size: 2
  grad_accum: 4
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 5             # замер каждые 5 шагов
  eval_batch_size: 4
  gradient_checkpointing: true
  max_steps: 15             # 15 шагов на CPU займут ~2.5 минуты

variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  max_new_tokens: 40
  prompts:
    - "Тема:\nПравила игры IFAB: положение вне игры\n\nВопрос:\nВ каком случае игрок, находящийся в положении вне игры, НЕ наказывается за офсайд при получении мяча?\n\nВарианты ответа:\n0. При передаче мяча верхом от партнера\n1. При прямом получении мяча с углового удара\n2. При рикошете от перекладины ворот\n3. При блокировке защитника без касания мяча"
    - "Тема:\nПротокол видеоассистента судьи VAR\n\nВопрос:\nКакая категория эпизодов подлежит обязательной проверке видеоассистентом судьи (VAR)?\n\nВарианты ответа:\n0. Назначение второго углового удара подряд\n1. Прямая красная карточка\n2. Вынесение первой желтой карточки\n3. Нарушение правила аута"
    - "Тема:\nФутбольная тактика: позиционный прессинг\n\nВопрос:\nКакова главная цель триггера прессинга при передаче соперника на крайнего защитника?\n\nВарианты ответа:\n0. Растянуть линию собственной обороны\n1. Заблокировать фланг и отрезать направления продвижения мяча в центр\n2. Совершить тактический фол в центре поля\n3. Снизить темп матча до минимума"
    - "Тема:\nАналитика данных: ожидаемые голы xG\n\nВопрос:\nКакой фактор оказывает наибольшее влияние на расчет базового значения метрики xG удара?\n\nВарианты ответа:\n0. Процент владения мячом команды за последние 5 минут\n1. Дистанция до ворот и угол удара относительно створа\n2. Количество выполненных замен к моменту удара\n3. Погодные условия и влажность поля"
    - "Тема:\nПравила IFAB: лишение явной возможности забить гол (DOGSO)\n\nВопрос:\nКакое наказание выносится игроку за неумышленный фол в своей штрафной площади при попытке сыграть в мяч (DOGSO)?\n\nВарианты ответа:\n0. Пенальти и предупреждение (желтая карточка)\n1. Пенальти и удаление (красная карточка)\n2. Только пенальти без предъявления карточки\n3. Свободный удар из пределов вратарской площади"
  system: "Ты футбольный аналитик и эксперт по правилам IFAB. Дан вопрос и варианты ответа с нумерацией с 0. Выбери один правильный вариант. Ответь только номером варианта и текстом ответа, без объяснений."

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"